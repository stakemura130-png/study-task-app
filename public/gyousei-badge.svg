<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="goldGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFE680;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DAA520;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 外側の円 -->
  <circle cx="100" cy="100" r="95" fill="#C9A500"/>
  <circle cx="100" cy="100" r="90" fill="url(#goldGrad2)"/>

  <!-- 12個の札（花びき） -->
  <g fill="#FFFACD" stroke="#B8860B" stroke-width="1.5">
    <!-- 上 -->
    <ellipse cx="100" cy="25" rx="12" ry="20"/>
    <!-- 上右 -->
    <ellipse cx="137" cy="37" rx="12" ry="20" transform="rotate(-60 137 37)"/>
    <!-- 右上 -->
    <ellipse cx="163" cy="63" rx="12" ry="20" transform="rotate(-120 163 63)"/>
    <!-- 右 -->
    <ellipse cx="175" cy="100" rx="12" ry="20" transform="rotate(-180 175 100)"/>
    <!-- 右下 -->
    <ellipse cx="163" cy="137" rx="12" ry="20" transform="rotate(120 163 137)"/>
    <!-- 下右 -->
    <ellipse cx="137" cy="163" rx="12" ry="20" transform="rotate(60 137 163)"/>
    <!-- 下 -->
    <ellipse cx="100" cy="175" rx="12" ry="20"/>
    <!-- 下左 -->
    <ellipse cx="63" cy="163" rx="12" ry="20" transform="rotate(-60 63 163)"/>
    <!-- 左下 -->
    <ellipse cx="37" cy="137" rx="12" ry="20" transform="rotate(-120 37 137)"/>
    <!-- 左 -->
    <ellipse cx="25" cy="100" rx="12" ry="20" transform="rotate(180 25 100)"/>
    <!-- 左上 -->
    <ellipse cx="37" cy="63" rx="12" ry="20" transform="rotate(120 37 63)"/>
    <!-- 上左 -->
    <ellipse cx="63" cy="37" rx="12" ry="20" transform="rotate(60 63 37)"/>
  </g>

  <!-- 中央の円（背景） -->
  <circle cx="100" cy="100" r="55" fill="#FFE680" stroke="#B8860B" stroke-width="2"/>

  <!-- 中央の「回」のような枠 -->
  <g fill="none" stroke="#8B6914" stroke-width="2.5" stroke-linecap="round">
    <rect x="80" y="80" width="40" height="40" rx="2"/>
  </g>

  <!-- 中央の札（4個） -->
  <g fill="#FFFACD" stroke="#B8860B" stroke-width="1">
    <!-- 上 -->
    <ellipse cx="100" cy="88" rx="5" ry="8"/>
    <!-- 右 -->
    <ellipse cx="112" cy="100" rx="5" ry="8" transform="rotate(90 112 100)"/>
    <!-- 左 -->
    <ellipse cx="88" cy="100" rx="5" ry="8" transform="rotate(90 88 100)"/>
    <!-- 下 -->
    <ellipse cx="100" cy="112" rx="5" ry="8"/>
  </g>

  <!-- 中央の十字 -->
  <g stroke="#8B6914" stroke-width="1.5" stroke-linecap="round">
    <line x1="95" y1="100" x2="105" y2="100"/>
    <line x1="100" y1="95" x2="100" y2="105"/>
  </g>

  <!-- 光沢 -->
  <ellipse cx="70" cy="45" rx="12" ry="16" fill="#FFFFFF" opacity="0.3"/>
</svg>