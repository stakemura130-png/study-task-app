<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFE680;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DAA520;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 外側の円 -->
  <circle cx="100" cy="100" r="95" fill="#C9A500"/>
  <circle cx="100" cy="100" r="90" fill="url(#goldGrad)"/>

  <!-- 放射線状の線（32本） -->
  <g stroke="#B8860B" stroke-width="2.5" stroke-linecap="round">
    <line x1="100" y1="10" x2="100" y2="30"/>
    <line x1="119.2" y1="14.1" x2="115" y2="32"/>
    <line x1="135.4" y1="24.6" x2="127" y2="40"/>
    <line x1="148.5" y1="39.7" x2="138" y2="52"/>
    <line x1="157.6" y1="57.6" x2="145" y2="66"/>
    <line x1="162.5" y1="77" x2="148" y2="82"/>
    <line x1="162.5" y1="97" x2="148" y2="100"/>
    <line x1="157.6" y1="117" x2="145" y2="115"/>
    <line x1="148.5" y1="134" x2="138" y2="128"/>
    <line x1="135.4" y1="147" x2="127" y2="137"/>
    <line x1="119.2" y1="157" x2="115" y2="142"/>
    <line x1="100" y1="162" x2="100" y2="147"/>
    <line x1="80.8" y1="157" x2="85" y2="142"/>
    <line x1="64.6" y1="147" x2="73" y2="137"/>
    <line x1="51.5" y1="134" x2="62" y2="128"/>
    <line x1="42.4" y1="117" x2="55" y2="115"/>
    <line x1="37.5" y1="97" x2="52" y2="100"/>
    <line x1="37.5" y1="77" x2="52" y2="82"/>
    <line x1="42.4" y1="57.6" x2="55" y2="66"/>
    <line x1="51.5" y1="39.7" x2="62" y2="52"/>
    <line x1="64.6" y1="24.6" x2="73" y2="40"/>
    <line x1="80.8" y1="14.1" x2="85" y2="32"/>
  </g>

  <!-- 中央の大きな円（背景） -->
  <circle cx="100" cy="100" r="60" fill="#FFE680" stroke="#B8860B" stroke-width="2"/>

  <!-- 天秤の支柱 -->
  <line x1="100" y1="70" x2="100" y2="95" stroke="#8B6914" stroke-width="3" stroke-linecap="round"/>

  <!-- 天秤の横棒 -->
  <line x1="65" y1="95" x2="135" y2="95" stroke="#8B6914" stroke-width="3" stroke-linecap="round"/>

  <!-- 左の皿 -->
  <path d="M 65 95 Q 55 105 65 115 Q 75 105 65 95 Z" fill="#8B6914"/>
  <path d="M 65 95 Q 55 105 65 115 Q 75 105 65 95 Z" stroke="#6B5109" stroke-width="1.5" fill="none"/>

  <!-- 右の皿 -->
  <path d="M 135 95 Q 125 105 135 115 Q 145 105 135 95 Z" fill="#8B6914"/>
  <path d="M 135 95 Q 125 105 135 115 Q 145 105 135 95 Z" stroke="#6B5109" stroke-width="1.5" fill="none"/>

  <!-- 光沢 -->
  <ellipse cx="70" cy="45" rx="12" ry="16" fill="#FFFFFF" opacity="0.3"/>
</svg>